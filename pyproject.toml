[project]
name = "jobdeck"
version = "0.1.0"
description = "Open-source job application cockpit: discover jobs, draft tailored applications with AI, send with one-click approval, and track replies automatically."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andrei Sili" }]
requires-python = ">=3.12"
keywords = ["jobs", "job-search", "applications", "automation", "germany", "bewerbung"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "nicegui>=3.14",
    "apscheduler>=3.11,<4",
    # 0.28 is the implementation netsafe's IDN guard was audited against: its
    # encode_host is idna.encode(host.lower()), the exact call the guard screens
    # with. A test pins the coupling so an upgrade that breaks it turns red.
    "httpx>=0.28",
    "anthropic>=0.116",  # structured outputs (output_config) required
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    # imported directly: gmail.py classifies HttpLib2Error as an ambiguous
    # send, so it must not rest on a transitive dependency
    "httplib2>=0.22",
    # imported directly: netsafe checks an IDN host via the exact IDNA form
    # httpx connects to, so both must encode with the same library
    "idna>=3.7",
    "pypdf>=5.0",
    # decodes and re-encodes the Mappe's images so the attachment fits the
    # channel's size budget; only Image.open/resize/save and the LANCZOS
    # resampling filter are used, stable API since Pillow 9.1
    "pillow>=11.0",
    # registrable-domain (eTLD+1) trust-anchor matching; the PSL snapshot ships
    # inside the wheel (zero network at runtime) and freshens via dependency
    # upgrades — the version suffix IS the snapshot date
    "publicsuffixlist>=1.0.2.20260726",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/andrei-sili/jobdeck"
Issues = "https://github.com/andrei-sili/jobdeck/issues"

[project.scripts]
jobdeck = "jobdeck.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobdeck"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# NiceGUI's in-process page harness. `user_plugin`, not the full `plugin`:
# the latter pulls in selenium for its browser fixture, which this project
# neither needs nor installs.
markers = ["nicegui_main_file: entry point for the NiceGUI user fixture"]
